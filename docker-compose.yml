# =============================================================================
# CampusWay Production & Multi-Container Docker Compose Specification
#
# Default Mode:
#   Runs backend and frontend with remote Neon PostgreSQL (specified via DATABASE_URL).
#   Command: docker-compose up --build
#
# Optional Local Database Mode:
#   Runs backend, frontend, and a local PostgreSQL container using the 'local-db' profile.
#   Command: docker-compose --profile local-db up --build
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusway_postgres
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${LOCAL_DB_NAME:-campusway_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-postgres} -d ${LOCAL_DB_NAME:-campusway_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusway-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campusway_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PROJECT_NAME=${PROJECT_NAME:-CampusWay Route Intelligence Service}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-campusway-admin-dev-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-campusway-jwt-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - campusway-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    container_name: campusway_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - campusway-network

networks:
  campusway-network:
    name: campusway_network
    driver: bridge

volumes:
  pgdata:
    name: campusway_pgdata
